# Serves the built SPA and proxies the API, so the browser sees one origin and
# no CORS preflight is involved.

upstream reflex_api {
    # `backend` is the service name in docker-compose.yml.
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://reflex_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Training log streaming is server-sent events: buffering here would
        # hold every message until the job ended.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # A fine-tune can run for a long time before the next log line.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Client-side routing: unknown paths resolve to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
